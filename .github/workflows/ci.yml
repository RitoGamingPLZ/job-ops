name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format (Vite+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
      - name: Run Vite+ check
        run: vp check

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root
        working-directory: .
      - name: Build better-sqlite3
        run: npm --workspace orchestrator rebuild better-sqlite3
        working-directory: .
      - name: Run Tests
        run: npm run test:all -- --shard=${{ matrix.shard }}
        working-directory: .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - orchestrator
          - adzuna-extractor
          - hiringcafe-extractor
          - gradcracker-extractor
          - startupjobs-extractor
          - workingnomads-extractor
          - ukvisajobs-extractor
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root
        working-directory: .

      - name: Check shared package types
        run: npm run check:types:shared
        working-directory: .

      - name: Type Check ${{ matrix.project }}
        run: npm --workspace ${{ matrix.project }} run check:types
        working-directory: .

      - name: Build ${{ matrix.project }} (client)
        if: matrix.project == 'orchestrator'
        run: npm --workspace orchestrator run build:client
        working-directory: .

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root
        working-directory: .

      - name: Build documentation site
        run: npm run check:docs
        working-directory: .

  cloudflare-worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare

      - name: Typecheck Worker
        run: npm run check:types
        working-directory: cloudflare

      - name: Test Worker
        run: npm test
        working-directory: cloudflare
