name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format (Vite+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
          # `vp install` runs the project's package manager (npm, from package-lock.json) and fails
          # instead of rewriting the lockfile.
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Run Vite+ check
        run: vp check

  # When the lint job fails on a same-repo PR, or on a direct push to main (which never goes
  # through a PR, so the PR path would miss it), apply `vp check --fix` and push the result back
  # to that branch. The lint job stays a plain `vp check`, so it remains the gate.
  # Commits pushed with the default GITHUB_TOKEN do not trigger new workflow runs; to have CI
  # re-run on the autofix commit, add a PAT or GitHub App token as the AUTOFIX_TOKEN secret.
  # (If main is branch-protected, that token must be allowed to push to it.)
  autofix:
    name: Autofix lint & format
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'failure' &&
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
          # `vp install` runs the project's package manager (npm, from package-lock.json) and fails
          # instead of rewriting the lockfile.
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Apply Vite+ fixes
        run: vp check --fix || true
      - name: Commit and push fixes
        run: |
          if git diff --quiet; then
            echo "No auto-fixable changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply vp check --fix"
          git push

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
          # `vp install` runs the project's package manager (npm, from package-lock.json) and fails
          # instead of rewriting the lockfile.
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Build better-sqlite3
        run: npm --workspace orchestrator rebuild better-sqlite3
      - name: Run Tests
        run: vp run test:all --shard=${{ matrix.shard }}

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - job-ops-orchestrator
          - adzuna-extractor
          - hiringcafe-extractor
          - jobindex-extractor
          - freehire-extractor
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
          # `vp install` runs the project's package manager (npm, from package-lock.json) and fails
          # instead of rewriting the lockfile.
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check shared package types
        run: vp run check:types:shared

      - name: Type Check ${{ matrix.project }}
        run: vp run --filter ${{ matrix.project }} check:types

      - name: Build ${{ matrix.project }} (client)
        if: matrix.project == 'job-ops-orchestrator'
        run: |
          vp run --filter job-ops-orchestrator build:client
          vp run --filter job-ops-orchestrator build:pdf-worker
          vp run --filter job-ops-orchestrator build:careers-worker

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build documentation site
        run: vp run check:docs

  cloudflare-worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          working-directory: cloudflare
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Typecheck Worker
        run: vp run check:types
        working-directory: cloudflare

      - name: Test Worker
        run: vp run test
        working-directory: cloudflare
