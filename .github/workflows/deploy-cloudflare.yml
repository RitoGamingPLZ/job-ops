name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  build:
    name: Build App & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build client and DO bundle
        run: |
          vp run --filter job-ops-orchestrator build:client
          vp run --filter job-ops-orchestrator build:do
          vp run --filter job-ops-orchestrator build:pdf-worker
          vp run --filter job-ops-orchestrator build:careers-worker

      - name: Build documentation site
        run: vp run --filter docs-site build

      - name: Copy docs into client dist
        run: |
          mkdir -p orchestrator/dist/client/docs
          cp -r docs-site/build/* orchestrator/dist/client/docs/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-dist
          path: orchestrator/dist
          retention-days: 1

  check-worker:
    name: Check Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          working-directory: cloudflare
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Typecheck Worker
        run: vp run check:types
        working-directory: cloudflare

      - name: Test Worker
        run: vp run test
        working-directory: cloudflare

  deploy:
    name: Deploy Worker & Container
    needs: [build, check-worker]
    runs-on: ubuntu-latest
    # The only GitHub token use is reading public release metadata during the image build.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: orchestrator-dist
          path: orchestrator/dist

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          working-directory: cloudflare
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      # Wrangler runs its own `docker build` on the runner's default builder. Building the same
      # layers there first, with the GitHub token as a BuildKit secret, leaves the Camoufox
      # download cached for Wrangler's build, so it never calls GitHub's anonymous API
      # (60 requests/hour per runner IP, which CI regularly exhausts). It must use the default
      # builder (not a buildx container builder) and Wrangler's flags, or the cache is not shared.
      - name: Warm Container image layers (authenticated Camoufox download)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --platform linux/amd64 --provenance=false \
            --target camoufox-cache \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f cloudflare/Dockerfile -t cf-container-warm .

      - name: Deploy with Wrangler
        shell: bash
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            log_file="$(mktemp)"
            status=0
            vp exec wrangler deploy 2>&1 | tee "$log_file" || status=$?
            if [ "$status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ] && grep -Eiq "Bad Gateway|Service Unavailable|Gateway Timeout|Internal Server Error|HTTP[^[:alnum:]]+50[234]|status( code)?[^[:alnum:]]+50[234]|ECONNRESET|ETIMEDOUT|fetch failed" "$log_file"; then
              delay=$((attempt * 15))
              echo "::warning::Wrangler deploy hit a transient upstream error (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
              rm -f "$log_file"
              sleep "$delay"
              continue
            fi
            rm -f "$log_file"
            exit "$status"
          done
