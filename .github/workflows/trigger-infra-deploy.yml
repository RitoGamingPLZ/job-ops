name: Trigger Cloudflare Infra Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trigger-infra-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-infra:
    name: Debounce (1m) & Dispatch RitoGamingPLZ/job-ops-infra
    runs-on: ubuntu-latest
    steps:
      - name: Wait 1 minute to group rapid commits
        if: github.event_name != 'workflow_dispatch'
        run: sleep 60

      - name: Trigger Cloudflare infra deployment
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          APP_SHA: ${{ github.sha }}
        run: |
          if [ -z "${INFRA_DISPATCH_TOKEN}" ]; then
            echo "::notice::INFRA_DISPATCH_TOKEN secret is not set on RitoGamingPLZ/job-ops. Configure a PAT scoped to RitoGamingPLZ/job-ops-infra (Contents: Write) to enable automatic cross-repo deploy on merge to main."
            exit 0
          fi

          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/RitoGamingPLZ/job-ops-infra/dispatches" \
            -d "{\"event_type\":\"app-main-merged\",\"client_payload\":{\"app_sha\":\"${APP_SHA}\",\"app_ref\":\"main\"}}"
