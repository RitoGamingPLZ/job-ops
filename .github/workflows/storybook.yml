name: Storybook

# Builds the component gallery (Ladle, which reads the same *.stories.tsx files) for every commit
# pushed to a pull request branch, and for main. The build is always attached as an artifact. When
# the repository has a Cloudflare Pages project configured (see "Preview hosting" below), each
# branch also gets its own preview URL, which is posted on the pull request.
#
# Preview hosting (optional): set the repository variable STORYBOOK_PAGES_PROJECT to the name of a
# Cloudflare Pages project. The existing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are
# reused, and the token needs the "Cloudflare Pages: Edit" permission. The project is created on
# first use. Without the variable the workflow only builds and uploads the artifact.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Build component gallery
        run: npm --workspace orchestrator run ladle:build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: orchestrator/storybook-static
          retention-days: 14

  preview:
    name: Publish preview
    needs: build
    # Fork PRs have no access to secrets, so only same-repository branches (and main) are published.
    if: >-
      ${{ vars.STORYBOOK_PAGES_PROJECT != '' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PAGES_PROJECT: ${{ vars.STORYBOOK_PAGES_PROJECT }}
      PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.22.1"
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Create the Pages project if it does not exist yet
        working-directory: cloudflare
        run: vp exec wrangler pages project create "$PAGES_PROJECT" --production-branch main || true
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: cloudflare
        run: |
          vp exec wrangler pages deploy ../storybook-static \
            --project-name "$PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}" \
            --commit-dirty=true | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL on the pull request
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- storybook-preview -->";
            const body = `${marker}\n**Storybook preview:** ${process.env.PREVIEW_URL}\n\nUpdated for \`${context.payload.pull_request.head.sha.slice(0, 7)}\`.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
