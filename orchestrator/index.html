<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Job Ops Orchestrator - Manage your job applications intelligently"
    />
    <title>Job Ops | Orchestrator</title>
    <script>
      // Apply the saved theme before first paint (default: dark). Keep in sync with client/lib/theme.ts.
      try {
        document.documentElement.classList.toggle(
          "dark",
          localStorage.getItem("jobops.theme") !== "light",
        );
      } catch (_) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      window.op =
        window.op ||
        (() => {
          const queue = [];
          const track = (...args) => {
            if (args.length > 0) {
              queue.push(args);
            }
          };

          return new Proxy(track, {
            get: (_target, property) => {
              if (property === "q") {
                return queue;
              }

              return (...args) => {
                queue.push([property, ...args]);
              };
            },
            has: (_target, property) => property === "q",
          });
        })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
