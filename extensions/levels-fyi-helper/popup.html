<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job-Ops Levels.fyi Helper</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 12px;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        line-height: 1.45;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 13px;
      }
      .muted {
        color: #94a3b8;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 8px 10px;
        margin: 8px 0;
      }
      button {
        margin-top: 6px;
        background: #334155;
        color: #f8fafc;
        border: none;
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 11px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Job-Ops Levels.fyi Helper</h1>
    <div id="status" class="card muted">Checking active lookup…</div>
    <div class="muted">
      Click <strong>Check salary on Levels.fyi</strong> on any job in Job-Ops, then click
      <strong>Send to Job-Ops</strong> in the overlay on Levels.fyi.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
